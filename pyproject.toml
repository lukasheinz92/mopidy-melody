[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mopidy-melody"
version = "0.1.0"
description = "Modern, responsive Mopidy web client with smart cover art"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
authors = [{ name = "Lukas Heinz", email = "94646007+lukasheinz92@users.noreply.github.com" }]
classifiers = [
    "Environment :: No Input/Output (Daemon)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Sound/Audio :: Players",
]
dependencies = [
    "mopidy>=4.0.0",
    "tornado>=6.4",
    "httpx>=0.28",
    "mutagen>=1.47",
    "pillow>=10",
]

[project.urls]
Homepage = "https://github.com/lukasheinz92/mopidy-melody"
Repository = "https://github.com/lukasheinz92/mopidy-melody"
Issues = "https://github.com/lukasheinz92/mopidy-melody/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.entry-points."mopidy.ext"]
melody = "mopidy_melody:Extension"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mopidy_melody = ["ext.conf", "www/*", "www/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
