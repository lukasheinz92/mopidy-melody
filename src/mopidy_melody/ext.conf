[melody]
enabled = true

# Name shown in the browser tab and when installed as an app.
title = Melody

# Browse URIs used to build the "Albums" and "Artists" sections. Each entry
# becomes a source chip; sources whose backend isn't running are hidden.
album_uris =
    local:directory?type=album
    jellyfin:albums
artist_uris =
    local:directory?type=artist&role=albumartist
    jellyfin:artists

# Cover art. Sources are tried in order until one returns an image.
#   art_local    - for local:/file: URIs; embedded = tags inside the audio
#                  file (ID3/FLAC/MP4), folder = cover.jpg/folder.jpg/... next
#                  to the file, backend = images reported by Mopidy-Local
#   art_jellyfin - for jellyfin: URIs; jellyfin = Jellyfin image API
#   art_other    - for every other backend (YouTube, radio, ...)
#   art_web      - tried last for everything: deezer, musicbrainz
#                  (MusicBrainz + Cover Art Archive). Leave empty to disable.
art_local = embedded, folder, backend
art_jellyfin = jellyfin, backend
art_other = backend
art_web = deezer, musicbrainz

# Longest edge of cached images in pixels.
art_size = 1024
# Timeout in seconds for each web/Jellyfin request.
art_timeout = 8
# Defaults to <core cache_dir>/melody/art
art_cache_dir =

# Jellyfin server for cover art. Empty = taken from the [jellyfin] section.
jellyfin_url =
jellyfin_token =

# Snapcast server for the "Rooms" view, e.g. http://snapserver:1780
# Empty disables multiroom control.
snapcast_url =
